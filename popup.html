<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>分享链接清理</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --card: #ffffff;
        --ink: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #0f766e;
        --accent-hover: #0d9488;
        --danger: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px 8px;
      }
      header img { width: 20px; height: 20px; }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .hint {
        margin: 0 14px 10px;
        color: var(--muted);
        font-size: 12px;
      }
      .panel {
        margin: 0 12px 12px;
        padding: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 11px;
      }
      textarea, .url {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
        background: #fafafa;
      }
      textarea {
        resize: vertical;
        min-height: 72px;
      }
      .url {
        word-break: break-all;
        color: var(--accent);
        min-height: 38px;
        background: #f0fdfa;
      }
      .url.empty { color: var(--muted); background: #fafafa; }
      .error { color: var(--danger); margin: 6px 0 0; font-size: 12px; }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      button {
        flex: 1;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #open {
        background: var(--accent);
        color: #fff;
      }
      #open:hover { background: var(--accent-hover); }
      #open:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }
      #copy {
        background: #e5e7eb;
        color: var(--ink);
      }
      kbd {
        display: inline-block;
        padding: 0 5px;
        border: 1px solid #d1d5db;
        border-bottom-width: 2px;
        border-radius: 4px;
        background: #fff;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <h1>分享链接清理</h1>
    </header>
    <p class="hint">
      快捷键 <kbd>Alt</kbd>+<kbd>V</kbd> 可直接打开剪贴板中的链接；地址栏输入 <kbd>u</kbd> 再空格，粘贴文案后回车。
    </p>
    <div class="panel">
      <label for="source">分享文案</label>
      <textarea id="source" placeholder="正在读取剪贴板，也可直接粘贴到这里…"></textarea>
      <label for="url" style="margin-top: 8px;">提取到的链接</label>
      <div id="url" class="url empty">尚未找到链接</div>
      <p id="status" class="error" hidden></p>
      <div class="actions">
        <button id="open" type="button" disabled>打开链接</button>
        <button id="copy" type="button" disabled>复制链接</button>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
